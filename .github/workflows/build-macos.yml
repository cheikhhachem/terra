name: Build macOS

on:
  workflow_call:

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Create DMG
        run: |
          mkdir -p build/dmg
          hdiutil create \
            -volname "Terra" \
            -srcfolder "build/macos/Build/Products/Release/Terra.app" \
            -ov \
            -format UDZO \
            "build/dmg/Terra.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Terra-macOS
          path: build/dmg/Terra.dmg
